name: Locate Core Search differences

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-actions.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write detailed source inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import hashlib
          import json

          lines = Path('.source-manifest.sha256').read_text(encoding='utf-8').splitlines()
          assets = defaultdict(list)
          ui = []
          for line in lines:
              digest, path = line.split('  ', 1)
              if path.startswith('assets/'):
                  parts = path.split('/')
                  key = '/'.join(parts[:3]) if len(parts) >= 3 else '/'.join(parts[:-1])
                  assets[key].append(line)
              elif path.startswith('ui/'):
                  ui.append(line)

          result = {
              'asset_groups': {
                  name: {
                      'count': len(entries),
                      'sha256': hashlib.sha256(('\n'.join(entries) + '\n').encode()).hexdigest()
                  }
                  for name, entries in sorted(assets.items())
              },
              'ui': ui
          }
          Path('DETAILED_SOURCE_INVENTORY.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DETAILED_SOURCE_INVENTORY.json
          git commit -m "Record detailed source inventory"
          git push
