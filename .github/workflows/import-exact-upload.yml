name: Compare Core Search baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-exact-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize baseline manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import hashlib
          import json

          manifest = Path('.source-manifest.sha256').read_text(encoding='utf-8').splitlines()
          groups = defaultdict(list)
          for line in manifest:
              digest, path = line.split('  ', 1)
              top = path.split('/', 1)[0]
              groups[top].append((path, digest))

          summary = {
              'line_count': len(manifest),
              'manifest_sha256': hashlib.sha256(('\n'.join(manifest) + '\n').encode()).hexdigest(),
              'groups': {}
          }
          for group, entries in sorted(groups.items()):
              text = ''.join(f'{digest}  {path}\n' for path, digest in entries)
              summary['groups'][group] = {
                  'count': len(entries),
                  'sha256': hashlib.sha256(text.encode()).hexdigest()
              }
          Path('BASELINE_SUMMARY.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BASELINE_SUMMARY.json
          git commit -m "Record Core Search baseline hashes"
          git push
