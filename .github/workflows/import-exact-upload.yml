name: Seed Core Search from full source repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-exact-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Mark seed started
        shell: bash
        run: |
          echo "Full source seed started." > target/SEED_1_STARTED.txt
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add SEED_1_STARTED.txt
          git -C target commit -m "Start full Core Search seed"
          git -C target push origin HEAD:main

      - name: Check out full Core Search source
        uses: actions/checkout@v4
        with:
          repository: kellz11/core-search
          ref: main
          path: source
          fetch-depth: 1

      - name: Mark source checkout complete
        shell: bash
        run: |
          echo "Full source repository checkout completed." > target/SEED_2_SOURCE_READY.txt
          git -C target add SEED_2_SOURCE_READY.txt
          git -C target commit -m "Complete full Core Search checkout"
          git -C target push origin HEAD:main

      - name: Replace new repository with the full site base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/.git source/.sync-upload
          rm -f source/.github/workflows/install-uploaded-core-search.yml

          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/. target/

          cd target
          find . -type f \
            ! -path './.git/*' \
            ! -name '.source-manifest.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > .source-manifest.sha256

          git add -A
          git commit -m "Seed full Core Search site for exact ZIP comparison"
          git push origin HEAD:main

      - name: Record seed failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "The full source seed workflow failed. Check the latest Actions run for the failed step." > target/SEED_FAILED.txt
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add SEED_FAILED.txt
          git -C target commit -m "Record full Core Search seed failure" || true
          git -C target push origin HEAD:main || true
