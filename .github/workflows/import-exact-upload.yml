name: Import exact uploaded Core Search

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-exact-upload.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Download exact staged upload chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/core-chunks
          base="https://raw.githubusercontent.com/kellz11/core-search/main/.sync-upload"
          for name in chunk00.txt chunk01.txt chunk02.txt chunk03.txt chunk04.txt chunk05a.hex chunk05b.hex; do
            echo "Downloading $name"
            curl -fL --retry 5 --retry-delay 3 "$base/$name" -o "/tmp/core-chunks/$name"
          done

      - name: Reconstruct and verify exact uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          chunk_dir = Path('/tmp/core-chunks')
          names = [
              'chunk00.txt', 'chunk01.txt', 'chunk02.txt', 'chunk03.txt',
              'chunk04.txt', 'chunk05a.hex', 'chunk05b.hex'
          ]
          encoded_parts = []
          for name in names:
              path = chunk_dir / name
              text = ''.join(path.read_text(encoding='utf-8').split())
              if path.suffix == '.txt':
                  encoded_parts.append(text)
              else:
                  encoded_parts.append(bytes.fromhex(text).decode('ascii'))

          archive = base64.b64decode(''.join(encoded_parts), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = '889c7216e19d732c71595261eb48a778806602e83ad302e21341176b7b2d98de'
          print(f'Reconstructed ZIP size: {len(archive):,} bytes')
          print(f'SHA-256: {digest}')
          if digest != expected:
              raise SystemExit(f'Checksum mismatch. Expected {expected}, received {digest}.')
          Path('/tmp/core-search-main2.zip').write_bytes(archive)
          PY

      - name: Replace repository with uploaded project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/core-search-extracted
          mkdir -p /tmp/core-search-extracted
          unzip -q /tmp/core-search-main2.zip -d /tmp/core-search-extracted

          source_dir=/tmp/core-search-extracted
          entries=("$source_dir"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          fi

          test -f "$source_dir/index.html"
          test -f "$source_dir/app.js"
          test -f "$source_dir/README.md"
          test -d "$source_dir/assets"
          test -d "$source_dir/ui"

          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_dir"/. target/

      - name: Commit exact project to main
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import exact uploaded Core Search project"
          git push origin HEAD:main
